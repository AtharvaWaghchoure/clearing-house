specVersion: 1.0.0
description: CLEARING HOUSE — composes MatchingEngine settlements with ATS
  identity/control events and reconstructs per-trade compliance.
repository: https://github.com/AtharvaWaghchoure/clearing-house
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MatchingEngine
    network: hedera-testnet
    source:
      abi: MatchingEngine
      address: "0xa73690cb94d03ee05a68fd2de753964b73a7072a"
      startBlock: 40252086
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings.ts
      entities:
        - Settlement
        - TokenAccount
        - VenueStat
      abis:
        - name: MatchingEngine
          file: ./abis/MatchingEngine.json
      eventHandlers:
        - event: SettlementReceipt(indexed bytes32,indexed address,indexed
            address,address,uint256,address,uint256,bytes1,bytes1)
          handler: handleSettlementReceipt
  - kind: ethereum
    name: BondToken
    network: hedera-testnet
    source:
      abi: ATSToken
      address: "0x4f76877d98db72102127fab8b0a1e7fedf763604"
      startBlock: 40252086
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings.ts
      entities:
        - TokenAccount
        - ComplianceEvent
        - Token
      abis:
        - name: ATSToken
          file: ./abis/ATSToken.json
      eventHandlers:
        - event: Verified(indexed address,bool)
          handler: handleVerified
        - event: Blocked(indexed address,bool)
          handler: handleBlocked
  - kind: ethereum
    name: CashToken
    network: hedera-testnet
    source:
      abi: ATSToken
      address: "0xa6491faaf3f5ef0b582e2a865ca6e3b993d09f79"
      startBlock: 40252086
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings.ts
      entities:
        - TokenAccount
        - ComplianceEvent
        - Token
      abis:
        - name: ATSToken
          file: ./abis/ATSToken.json
      eventHandlers:
        - event: Verified(indexed address,bool)
          handler: handleVerified
        - event: Blocked(indexed address,bool)
          handler: handleBlocked
