[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
# Paris keeps bytecode free of PUSH0/transient-storage so it deploys cleanly on the
# Hedera testnet EVM as well as Arc. Do not bump without checking both targets.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
int_types = "long"

# JSON-RPC endpoints (Hedera via Hashio relay; Arc testnet). Keys come from .env.
[rpc_endpoints]
hedera_testnet = "https://testnet.hashio.io/api"
arc_testnet = "${ARC_TESTNET_RPC}"
